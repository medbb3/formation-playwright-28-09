# Exécution des tests dans Docker, front et back compris :
#   docker compose -f docker-compose.yml -f docker-compose.tests.yml run --rm tests
# Résultats dans frontend/test-results et frontend/playwright-report (volumes).
services:
  # Le navigateur tourne dans le conteneur `tests` : le front doit lui indiquer le backend par son nom de service
  frontend:
    environment:
      VITE_API_URL: "http://backend:8000"
  backend:
    environment:
      CORS_ORIGINS: "http://frontend:5173,http://localhost:5173"

  tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile.tests
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      BASE_URL: "http://frontend:5173"
      API_URL: "http://backend:8000"
      CI: "1"
    volumes:
      - ./frontend/test-results:/work/test-results
      - ./frontend/playwright-report:/work/playwright-report
      - ./frontend/blob-report:/work/blob-report
    ipc: host
