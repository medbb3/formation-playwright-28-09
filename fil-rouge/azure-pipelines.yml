# Pipeline de la mini-banque : PR (rapide) et main / nuit (complet). Tests exécutés dans Docker.
trigger:
  branches:
    include: [main]
  paths:
    include: [frontend/*, backend/*, azure-pipelines.yml, docker-compose*.yml, templates/*]

pr:
  branches:
    include: [main]

schedules:
- cron: '0 2 * * 1-5'            # 02:00 UTC du lundi au vendredi
  displayName: Suite complète nocturne
  branches:
    include: [main]
  always: true                   # même sans nouveau commit

variables:
  NODE_VERSION: '22.x'
  PLAYWRIGHT_VERSION: '1.62.1'   # = @playwright/test dans frontend/package.json
  PLAYWRIGHT_IMAGE: 'mcr.microsoft.com/playwright:v$(PLAYWRIGHT_VERSION)-noble'
  npm_config_cache: $(Pipeline.Workspace)/.npm
  ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    TESTS_GREP: '@smoke'
    TESTS_PROJECTS: '--project=setup-real --project=chromium'
  ${{ else }}:
    TESTS_GREP: ''
    TESTS_PROJECTS: '--project=setup-real --project=chromium'

pool:
  vmImage: ubuntu-latest         # remplacer par `name: docker-local` pour un agent auto-hébergé (M9.2)

stages:
# ------------------------------------------------------------------ 1. Vérification rapide
- stage: Verification
  displayName: Lint et tests API
  jobs:
  - job: Lint
    displayName: ESLint, TypeScript, secrets
    steps:
    - task: NodeTool@0
      inputs: { versionSpec: $(NODE_VERSION) }
    - task: Cache@2
      displayName: Cache npm
      inputs:
        key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
        restoreKeys: 'npm | "$(Agent.OS)"'
        path: $(npm_config_cache)
    - script: npm ci
      workingDirectory: frontend
      displayName: npm ci
    - script: npx tsc -b && npm run lint
      workingDirectory: frontend
      displayName: TypeScript et ESLint
    - script: |
        docker run --rm -v "$(Build.SourcesDirectory):/repo" zricethezav/gitleaks:latest detect --source /repo --no-banner --redact
      displayName: Scan de secrets (gitleaks)

  - job: TestsAPI
    displayName: Tests API (docker compose, backend seul)
    steps:
    - script: docker compose -f docker-compose.yml -f docker-compose.tests.yml build backend tests
      displayName: Images
    - script: |
        docker compose -f docker-compose.yml -f docker-compose.tests.yml up -d --wait backend
        docker compose -f docker-compose.yml -f docker-compose.tests.yml run --rm --no-deps tests npx playwright test --project=api
      displayName: Tests API
      env: { API_URL: 'http://backend:8000' }
    - script: docker compose -f docker-compose.yml -f docker-compose.tests.yml down -v
      condition: always()
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs: { testResultsFormat: JUnit, testResultsFiles: frontend/test-results/junit.xml, testRunTitle: 'Playwright API', failTaskOnFailedTests: false }

# ------------------------------------------------------------------ 2. Tests UI dans Docker (compose)
- stage: TestsUI
  displayName: Tests UI (docker compose)
  dependsOn: Verification
  jobs:
  - job: UI
    displayName: Front + back + tests en conteneurs
    timeoutInMinutes: 40
    steps:
    - script: |
        docker compose -f docker-compose.yml -f docker-compose.tests.yml build
      displayName: Construire les images
    - script: |
        docker compose -f docker-compose.yml -f docker-compose.tests.yml run --rm tests \
          npx playwright test $(TESTS_PROJECTS) $(if [ -n "$(TESTS_GREP)" ]; then echo --grep "$(TESTS_GREP)"; fi)
      displayName: Exécuter les tests
    - script: docker compose -f docker-compose.yml -f docker-compose.tests.yml down -v
      displayName: Arrêter les conteneurs
      condition: always()
    - task: PublishTestResults@2
      displayName: Publier les résultats JUnit
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'frontend/test-results/junit.xml'
        testRunTitle: 'Playwright UI ($(Build.Reason))'
        failTaskOnFailedTests: false
    - task: PublishPipelineArtifact@1
      displayName: Publier le rapport HTML
      condition: succeededOrFailed()
      inputs:
        targetPath: frontend/playwright-report
        artifact: playwright-report-ui
    - task: PublishPipelineArtifact@1
      displayName: Publier les traces des échecs
      condition: failed()
      inputs:
        targetPath: frontend/test-results
        artifact: test-results-ui
    - task: NodeTool@0
      inputs: { versionSpec: $(NODE_VERSION) }
      condition: succeededOrFailed()
    - script: node scripts/quality-gate.mjs frontend/test-results/report.json pr
      displayName: Quality gates PR (réussite, stabilité, durée)
      condition: succeededOrFailed()


- stage: Nuit
  displayName: Suite complète (shards)
  dependsOn: Verification
  condition: or(eq(variables['Build.Reason'], 'Schedule'), eq(variables['FORCE_NUIT'], 'true'))
  variables:
  - group: mini-banque-tests            # ALICE_PASSWORD, BOB_PASSWORD, CAROL_PASSWORD, API_URL
  jobs:
  - job: Shards
    strategy:
      matrix:
        s1: { SHARD: 1 }
        s2: { SHARD: 2 }
        s3: { SHARD: 3 }
    timeoutInMinutes: 30
    steps:
    - script: docker compose -f docker-compose.yml -f docker-compose.tests.yml build
      displayName: Images
    - script: |
        docker compose -f docker-compose.yml -f docker-compose.tests.yml run --rm \
          -e ALICE_PASSWORD -e BOB_PASSWORD -e CAROL_PASSWORD \
          tests npx playwright test --project=setup-real --project=chromium --project=api --project=visuel \
          --shard=$(SHARD)/3 --reporter=blob
      displayName: Shard $(SHARD)/3
      env:
        ALICE_PASSWORD: $(ALICE_PASSWORD)   # secrets mappés explicitement, jamais affichés
        BOB_PASSWORD: $(BOB_PASSWORD)
        CAROL_PASSWORD: $(CAROL_PASSWORD)
    - script: docker compose -f docker-compose.yml -f docker-compose.tests.yml down -v
      condition: always()
    - task: PublishPipelineArtifact@1
      condition: succeededOrFailed()
      inputs: { targetPath: frontend/blob-report, artifact: blob-$(SHARD) }

  - job: Fusion
    dependsOn: Shards
    condition: succeededOrFailed()
    steps:
    - task: NodeTool@0
      inputs: { versionSpec: '22.x' }
    - task: DownloadPipelineArtifact@2
      inputs: { patterns: 'blob-*/**', path: $(Pipeline.Workspace)/blobs }
    - script: |
        cd frontend && npm ci
        mkdir -p all-blob && find $(Pipeline.Workspace)/blobs -name '*.zip' -exec cp {} all-blob/ \;
        npx playwright merge-reports --reporter html,junit,json all-blob
        mkdir -p test-results && mv report.json test-results/report.json 2>/dev/null || true
      displayName: Fusion des shards
      env: { PLAYWRIGHT_JUNIT_OUTPUT_NAME: test-results/junit.xml }
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs: { testResultsFormat: JUnit, testResultsFiles: frontend/test-results/junit.xml, testRunTitle: 'Nuit (fusion)', failTaskOnFailedTests: false }
    - task: PublishPipelineArtifact@1
      condition: succeededOrFailed()
      inputs: { targetPath: frontend/playwright-report, artifact: playwright-report-nuit }
    - script: node scripts/quality-gate.mjs frontend/test-results/report.json nightly
      displayName: Quality gates (réussite, stabilité)
    - script: node scripts/coverage-criteres.mjs frontend/specs frontend/tests
      displayName: Quality gate (couverture des critères)

- stage: Hebdo
  displayName: Matrice navigateurs (smoke)
  dependsOn: Verification
  condition: and(eq(variables['Build.Reason'], 'Schedule'), eq(variables['HEBDO'], 'true'))
  jobs:
  - job: Navigateurs
    strategy:
      matrix:
        chromium: { PROJET: chromium }
        firefox: { PROJET: firefox }
        webkit: { PROJET: webkit }
    steps:
    - script: docker compose -f docker-compose.yml -f docker-compose.tests.yml build
    - script: |
        docker compose -f docker-compose.yml -f docker-compose.tests.yml run --rm tests \
          npx playwright test --project=setup-real --project=$(PROJET) --grep @smoke
      displayName: Smoke $(PROJET)
    - script: docker compose -f docker-compose.yml -f docker-compose.tests.yml down -v
      condition: always()
    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs: { testResultsFormat: JUnit, testResultsFiles: frontend/test-results/junit.xml, testRunTitle: 'Hebdo $(PROJET)', failTaskOnFailedTests: false }